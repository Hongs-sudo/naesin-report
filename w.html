<title>수학도서관 · 내신대비 주간 리포트</title>
<style>
:root{--g:#0A4844;--g2:#15867A;--gold:#DEBC62;--goldi:#7A5C14;--ink:#111;--ink2:#4A5553;--ink3:#8A978F;--paper:#F7F4EC;--g1:#E3EEEC;--line:#DFE6E0;--bg:#EEF2EE;--up:#2F9E5E;--down:#C94A3E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
.serif{font-family:"Noto Serif KR","Nanum Myeongjo",serif}
.pg{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg)}
.hd{background:var(--g);color:#fff;padding:18px 20px 18px}
.hd img{width:132px;height:auto;display:block}
.hd .dt{margin-top:12px;font-size:13px;font-weight:600;color:#A8CFC7}
.hd .tt{margin-top:2px;font-size:21px;font-weight:800;letter-spacing:-.03em}
.who{background:#fff;padding:13px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.who .nm{font-size:23px;font-weight:800;letter-spacing:-.04em}
.who .gr{font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--g1);border-radius:6px;padding:3px 8px}
.who .wk{margin-left:auto;font-size:13px;font-weight:800;background:var(--g);color:var(--gold);border-radius:99px;padding:6px 12px}
.bd{padding:12px 12px 24px;display:flex;flex-direction:column;gap:12px}
.cd{background:#fff;border-radius:16px;padding:16px;border:1px solid var(--line)}
.ct{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:800;color:var(--g);margin-bottom:12px}
.ct .no{width:22px;height:22px;flex:none;border-radius:6px;background:var(--g);color:var(--gold);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.ct .sub{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink3);text-align:right}
.dday{display:flex;align-items:center;gap:12px;background:var(--paper);border-color:#E8E0CC}
.dday .d{white-space:nowrap;font-size:24px;font-weight:900;color:var(--g);min-width:78px;text-align:center;border-right:1px solid #E1D7C0;padding-right:10px}
.dday .t{font-size:14px;font-weight:700;line-height:1.45}.dday .t small{display:block;font-weight:500;color:var(--ink2);font-size:12.5px;margin-top:2px}
.sum{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:116px;height:116px;flex:none}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:27px;font-weight:900;color:var(--g)}
.ring b small{font-size:11px;color:var(--ink3);font-weight:700}
.wb{flex:1;display:flex;gap:8px;align-items:flex-end;height:112px;border-bottom:1px solid var(--line);position:relative;margin-bottom:20px}
.wb .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;position:relative}
.wb .v{font-size:11px;font-weight:800;color:var(--g)}
.wb .bar{width:22px;max-width:100%;border-radius:6px 6px 0 0;background:var(--g2)}
.wb .bar.cur{background:var(--g)}.wb .bar.e{background:#E6ECE7;height:4px}
.wb .l{font-size:11px;color:var(--ink3);font-weight:700;position:absolute;bottom:-19px}
.wb .l.cur{color:var(--g)}
.tgt{position:absolute;left:0;right:0;border-top:1.5px dashed #E39A85;z-index:0}
.mini{display:flex;gap:6px;margin-top:10px}.mini span{flex:1;background:var(--paper);border-radius:10px;padding:7px 4px;text-align:center;font-size:11.5px;color:var(--ink2);font-weight:700}
.mini b{display:block;font-size:16px;color:var(--g);font-weight:900}
.bk{padding:10px 0;border-top:1px solid #EEF1EE}.bk:first-of-type{border-top:0;padding-top:0}
.bk .h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
.bk .h .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .tag{width:24px;height:22px;flex:none;border-radius:6px;background:var(--g1);color:var(--g);font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;font-weight:900}
.bk .p{margin-left:auto;font-size:15px;font-weight:900;color:var(--g);flex:none}.bk .p.done{color:var(--goldi)}
.bk .tr{height:8px;background:#E9EEEA;border-radius:9px;margin:7px 0 6px;overflow:hidden}.bk .tr i{display:block;height:100%;background:var(--g2);border-radius:9px}
.bk .ws{display:flex;gap:5px}.bk .ws span{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--ink3);background:#F4F6F4;border-radius:6px;padding:3px 0}
.bk .ws span.on{background:var(--g1);color:var(--g)}.bk .ws span.cur{box-shadow:inset 0 0 0 1.5px var(--g)}
.sc{display:flex;gap:8px;flex-wrap:wrap}.sc .b{flex:1 1 40%;background:var(--paper);border-radius:12px;padding:10px 12px}
.sc .b small{font-size:12px;color:var(--ink2);font-weight:700}.sc .b small i{font-style:normal;color:var(--ink3);font-weight:500}
.sc .b b{display:block;font-size:26px;font-weight:900;color:var(--g)}
.sc .b em{font-style:normal;font-size:12px;color:var(--ink3)}.up{color:var(--up);font-weight:800}.down{color:var(--down);font-weight:800}
.trend{margin-top:12px;display:block}
.hb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-top:9px}.hb .k{width:96px;flex:none}.hb .t{flex:1;height:8px;background:#E9EEEA;border-radius:9px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--g2)}
.hb .v{min-width:56px;text-align:right;color:var(--g);font-weight:900}
.empty{font-size:13px;color:var(--ink3);padding:4px 0}
.nt{font-size:14px;line-height:1.65}.nt li{list-style:none;padding:8px 0;border-top:1px solid #EEF1EE;display:flex;gap:8px;word-break:keep-all;overflow-wrap:anywhere}.nt li:first-child{border-top:0;padding-top:0}
.nt .d{flex:none;font-size:11px;font-weight:800;color:var(--g);background:var(--g1);border-radius:6px;padding:2px 6px;height:20px;margin-top:2px}
.sub2{font-size:12px;font-weight:800;color:var(--goldi);margin:12px 0 4px}
.msg{background:var(--g);color:#fff;border:0}.msg .ct{color:var(--gold)}.msg .ct .no{background:var(--gold);color:var(--g)}
.msg p{font-size:14px;line-height:1.8;color:#E9F2EF;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}.msg .sg{margin-top:10px;text-align:right;font-size:12.5px;color:var(--gold);font-weight:700}
.ack{background:#fff;border-radius:16px;padding:14px;text-align:center;border:1px solid var(--line)}
.ack button{width:100%;border:0;border-radius:12px;background:var(--g);color:#fff;font:inherit;font-size:16px;font-weight:800;padding:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ack button:disabled{opacity:.7}
.ack small{display:block;margin-top:8px;color:var(--ink3);font-size:12px}
.ack.is-done button{background:var(--g1);color:var(--g)}
.past{background:var(--paper)}.past a{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #E8E0CC;color:var(--ink);text-decoration:none;font-size:14px;font-weight:700}
.past a:first-of-type{border-top:0}.past a span{color:var(--goldi);font-weight:800;font-size:13px}.past a.on span{color:var(--ink3)}
.ft{text-align:center;color:var(--ink3);font-size:11.5px;padding:6px 0 14px;line-height:1.7}
.ft img{width:104px;display:block;margin:0 auto 6px}
.pv{background:#FFF3D6;color:#7A5C14;text-align:center;font-size:12.5px;font-weight:700;padding:7px}
.note{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:8px}
.note b{font-size:18px;color:var(--g)}.note p{font-size:14px;color:var(--ink2)}.note small{font-size:12.5px;color:var(--ink3)}
</style>

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pd(s){ var p = String(s).split("-"); return new Date(+p[0], +p[1]-1, +(p[2]||1)); }

  return (n.getMonth()+1) + "월 " + n.getDate() + "일 " + ap + " " + (h % 12 || 12) + ":" + ("0"+n.getMinutes()).slice(-2);
}
function note(t, p, s){
  document.getElementById("app").innerHTML = '<div class="pg"><div class="hd"><img src="' + LOGO_GOLD + '" alt="수학도서관"><div class="tt">내신대비 주간 리포트</div></div>'
    + '<div class="note"><b>' + esc(t) + '</b>' + (p ? '<p>' + esc(p) + '</p>' : '') + (s ? '<small>' + esc(s) + '</small>' : '') + '</div></div>';
}

/* ---------- 카드 ---------- */
function ddayCard(ex){
  if(!ex || !ex.start) return "";
  var t = today(), target = ex.math || ex.start, dd;
  if(ex.end && ex.end < t) dd = "종료";
  else { var n = days(t, target); dd = n > 0 ? "D-" + n : (n === 0 ? "D-day" : "시험 중"); }
  var period = mdw(ex.start) + (ex.end && ex.end !== ex.start ? " ~ " + mdw(ex.end) : "");
  var sub = [ex.math ? "수학 " + mdw(ex.math) : "", ex.range ? "범위 : " + ex.range : ""].filter(Boolean).join(" · ");
  var kind = /기말/.test(ex.title) ? "기말고사" : (/중간/.test(ex.title) ? "중간고사" : "시험");
  return '<div class="cd dday"><div class="d">' + esc(dd) + '</div><div class="t">' + kind + ' ' + esc(period) + (ex.tentative ? ' <span style="color:#8A978F;font-weight:500">(미확정)</span>' : '')
    + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div></div>';
}
function sumCard(W){
  var R = 46, C = 2 * Math.PI * R, v = W.total == null ? 0 : Math.min(100, W.total), dash = v / 100 * C;
  var ring = '<div class="ring"><svg viewBox="0 0 116 116" width="116" height="116"><circle cx="58" cy="58" r="' + R + '" fill="none" stroke="#E6ECE7" stroke-width="12"/>'
    + (dash > .5 ? '<circle cx="58" cy="58" r="' + R + '" fill="none" stroke="#0A4844" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + dash.toFixed(1) + ' ' + (C - dash).toFixed(1) + '" transform="rotate(-90 58 58)"/>' : '')
    + '</svg><b>' + (W.total == null ? "-" : W.total + "%") + '<small>종합 달성률</small></b></div>';
  var H = 82, max = Math.max(100, Math.max.apply(null, W.ach.map(function(x){ return x || 0; })));
  var bars = '<div class="wb"><div class="tgt" style="bottom:' + (100 / max * H + 0) + 'px"></div>' + W.ach.map(function(a, i){
    var cur = i + 1 === W.w;
    return '<div class="c"><span class="v">' + (a == null ? "" : a + "%") + '</span>'
      + (a == null ? '<div class="bar e"></div>' : '<div class="bar' + (cur ? ' cur' : '') + '" style="height:' + Math.max(4, a / max * H) + 'px"></div>')
      + '<span class="l' + (cur ? ' cur' : '') + '">' + (i+1) + '주</span></div>';
  }).join("") + '</div>';
  var sc = W.mocks.filter(function(m){ return m.score != null; });
  var avg = sc.length ? num(sc.reduce(function(a, m){ return a + m.score; }, 0) / sc.length) : null;
  var mini = '<div class="mini"><span>내신교재<b>' + pct(W.book) + '</b></span><span>모의고사 진행<b>' + (W.mbTotal ? W.mbDone + "/" + W.mbTotal + "회" : "-") + '</b></span><span>이번 주 평균<b>' + (avg == null ? "-" : avg) + '</b></span></div>';
  return '<div class="cd"><div class="ct">이번 주 한눈에<span class="sub">1~' + W.w + '주차 누적 · 점선 = 목표 100%</span></div><div class="sum">' + ring + bars + '</div>' + mini + '</div>';
}
function bookCard(W){
  if(!W.books.length) return "";
  var rows = W.books.map(function(b){
    var tag = b.tag === "오답" ? "오" : (b.tag || "");
    var done = b.cum != null && b.cum >= 100;
    return '<div class="bk"><div class="h"><span class="tag">' + esc(tag) + '</span><span class="nm">' + esc(String(b.name).replace(/^[A-D][12]?\s+(?=\S)/, "")) + '</span><span class="p' + (done ? ' done' : '') + '">' + (b.cum == null ? "-" : b.cum + "%" + (done ? " ✓" : "")) + '</span></div>'
      + '<div class="tr"><i style="width:' + Math.min(100, b.cum || 0) + '%"></i></div>'
      + '<div class="ws">' + b.pct.map(function(v, i){
          var cls = (v != null ? "on" : "") + (i + 1 === W.w ? " cur" : "");
          return '<span class="' + cls + '">' + (i+1) + '주' + (v != null ? " " + v + "%" : "") + '</span>';
        }).join("") + '</div></div>';
  }).join("");
  return '<div class="cd"><div class="ct"><span class="no">' + no() + '</span>내신교재 진행<span class="sub">' + esc(W.plan ? W.w + "주 " + W.plan : "주차별 진행 · 누적") + '</span></div>' + rows + '</div>';
}
function mockCard(W){
  var sc = W.mocks.filter(function(m){ return m.score != null; });
  var boxes = sc.length ? '<div class="sc">' + sc.map(function(m){
    var diff = m.avg != null ? num(m.score - m.avg) : null;
    var lab = String(m.label || "").replace(/^\d주차-/, "") ;
    lab = /^[12]$/.test(lab) ? lab + "차" : (m.label || "회차");
    return '<div class="b"><small>' + esc(lab) + (m.date ? ' <i>' + esc(md(m.date)) + '</i>' : '') + '</small><b>' + num(m.score) + '</b>'
      + '<em>' + (m.avg != null ? '평균 ' + num(m.avg) + ' · <span class="' + (diff >= 0 ? 'up' : 'down') + '">' + (diff >= 0 ? "+" : "") + diff + '</span>' : (m.scope ? esc(m.scope) : '&nbsp;')) + '</em></div>';
  }).join("") + '</div>' : '<div class="empty">이번 주 모의고사 점수가 아직 없습니다.</div>';
  var pts = W.trend.map(function(v, i){ return {x:40 + i * 80, v:v}; });
  var has = pts.filter(function(p){ return p.v != null; });
  var svg = "";
  if(has.length){
    var lo = Math.min.apply(null, has.map(function(p){ return p.v; })), hi = Math.max.apply(null, has.map(function(p){ return p.v; }));
    lo = Math.max(0, Math.floor((lo - 10) / 10) * 10); hi = Math.min(100, Math.ceil((hi + 5) / 10) * 10); if(hi - lo < 20) lo = Math.max(0, hi - 20);
    var y = function(v){ return 62 - (v - lo) / (hi - lo) * 50; };
    svg = '<svg class="trend" viewBox="0 0 330 92" width="100%"><line x1="10" y1="76" x2="320" y2="76" stroke="#E6ECE7"/>'
      + (has.length > 1 ? '<polyline points="' + has.map(function(p){ return p.x + "," + y(p.v).toFixed(1); }).join(" ") + '" fill="none" stroke="#0A4844" stroke-width="2.5"/>' : '')
      + pts.map(function(p, i){
          var cur = i + 1 === P.weeks[VIEW].w;
          return '<text x="' + p.x + '" y="89" font-size="10.5" text-anchor="middle" fill="' + (cur ? '#0A4844' : '#8A978F') + '"' + (cur ? ' font-weight="700"' : '') + '>' + (i+1) + '주</text>'
            + (p.v != null ? '<circle cx="' + p.x + '" cy="' + y(p.v).toFixed(1) + '" r="' + (cur ? 5.5 : 4.5) + '" fill="#0A4844"/><text x="' + p.x + '" y="' + (y(p.v) - 9).toFixed(1) + '" font-size="11" text-anchor="middle" fill="#0A4844" font-weight="700">' + p.v + '</text>' : '');
        }).join("") + '</svg>';
  }
  var prog = W.mbTotal ? '<div class="hb"><span class="k">진행 회차</span><span class="t"><i style="width:' + Math.min(100, W.mbDone / W.mbTotal * 100) + '%"></i></span><span class="v">' + W.mbDone + "/" + W.mbTotal + '회</span></div>' : "";
  return '<div class="cd"><div class="ct"><span class="no">' + no() + '</span>주말 모의고사 성적<span class="sub">' + W.w + '주차' + (svg ? ' · 아래는 주차별 내 평균' : '') + '</span></div>' + boxes + svg + prog + '</div>';
}
function extraCard(W){
  function row(k, v, sub){ return '<div class="hb"><span class="k">' + k + '</span><span class="t"><i style="width:' + Math.min(100, v || 0) + '%"></i></span><span class="v">' + (sub || pct(v)) + '</span></div>'; }
  if(W.ws == null && W.ee == null && W.wr == null) return "";
  return '<div class="cd"><div class="ct"><span class="no">' + no() + '</span>학습지 · 추가모의고사 · 전체오답</div>'
    + row("학교 학습지", W.ws) + row("추가 모의고사", W.ee, W.eeAdd ? W.eeDone + "/" + W.eeAdd + "건" : null) + row("전체오답", W.wr) + '</div>';
}
function lines(t){
  return String(t || "").split(/\n+/).map(function(x){ return x.trim(); }).filter(Boolean).map(function(x){
    var m = x.match(/^[·\-•]?\s*(\d{1,2}\/\d{1,2})(\([월화수목금토일]\))?\s*[·:\-]?\s*(.*)$/);
    return m ? '<li><span class="d">' + esc(m[1]) + '</span><span>' + esc(m[3] || "") + '</span></li>' : '<li><span>' + esc(x.replace(/^[·\-•]\s*/, "")) + '</span></li>';
  }).join("");
}
function noteCard(W){
  if(!W.notes && !W.teacherMsg && !W.change) return "";
  return '<div class="cd"><div class="ct"><span class="no">' + no() + '</span>' + W.w + '주차 학습 특이사항 · 전달사항</div>'
    + (W.notes ? '<ul class="nt">' + lines(W.notes) + '</ul>' : '')
    + (W.teacherMsg ? '<div class="sub2">전달사항</div><ul class="nt">' + lines(W.teacherMsg) + '</ul>' : '')
    + (W.change ? '<div class="sub2">교재 구성 변경</div><ul class="nt">' + lines(W.change) + '</ul>' : '') + '</div>';
}
function msgCard(W){
  if(!W.director) return "";
  return '<div class="cd msg"><div class="ct"><span class="no">' + no() + '</span>' + W.w + '주차 원장님 메시지</div><p>' + esc(W.director) + '</p><div class="sg">수학도서관 원장 홍재화</div></div>';
}
function render(){
  var W = P.weeks[VIEW], last = VIEW === P.weeks.length - 1; NO = 0;
  var ex = P.exam || {};
  var h = '<div class="pg">' + (PREVIEW ? '<div class="pv">선생님 미리보기 · 여기서 확인 버튼을 눌러도 확인으로 바뀌지 않습니다</div>' : '')
    + '<div class="hd"><img src="' + LOGO_GOLD + '" alt="수학도서관"><div class="dt">' + esc((ex.title || "").replace(/\s*\(.*\)$/, "")) + ' · ' + W.w + '주차' + (W.range ? ' (' + esc(W.range) + ')' : '') + '</div>'
    + '<div class="tt">내신대비 주간 리포트</div></div>'
    + '<div class="who"><span class="nm">' + esc(P.name) + '</span><span class="gr">' + esc([P.grade, P.school].filter(Boolean).join(" · ")) + '</span><span class="wk">' + W.w + '주차</span></div>'
    + '<div class="bd">' + ddayCard(ex) + sumCard(W) + bookCard(W) + mockCard(W) + extraCard(W) + noteCard(W) + msgCard(W);
  if(last){
    var done = !!READ;
    h += '<div class="ack' + (done ? ' is-done' : '') + '" id="ack"><button id="btnAck"' + (done ? ' disabled' : '') + '>✓ ' + (done ? '확인 완료' : '리포트 확인했습니다') + '</button>'
      + '<small id="doneTxt">' + (done ? whenText(READ) + " 확인하셨습니다" : "누르시면 담당 선생님께 확인 표시가 전달됩니다") + '</small></div>';
  }
  if(P.weeks.length > 1){
    h += '<div class="cd past"><div class="ct" style="margin-bottom:4px">' + (last ? '지난 주차 리포트' : '다른 주차 리포트') + '</div>'
      + P.weeks.map(function(x, i){ return i === VIEW ? '' : '<a href="#" data-i="' + i + '">' + x.w + '주차' + (x.range ? ' (' + esc(x.range) + ')' : '') + '<span>' + (i === P.weeks.length - 1 ? '이번 주 ›' : '열기 ›') + '</span></a>'; }).join("") + '</div>';
  }
  h += '<div class="ft"><img src="' + LOGO_GREEN + '" alt="수학도서관">상담 및 등록문의 010.3358.9007 (02.2651.7750)<br>이 링크는 보낸 날로부터 4주 동안 열어볼 수 있습니다.</div></div></div>';
  document.getElementById("app").innerHTML = h;
  document.title = P.name + " 학생 " + W.w + "주차 내신대비 주간 리포트";
  Array.prototype.forEach.call(document.querySelectorAll(".past a"), function(a){
    a.addEventListener("click", function(e){ e.preventDefault(); VIEW = +a.getAttribute("data-i"); render(); window.scrollTo(0, 0); });
  });
  var btn = document.getElementById("btnAck");
  if(btn && !READ) btn.addEventListener("click", function(){
    if(PREVIEW){ document.getElementById("doneTxt").textContent = "미리보기에서는 확인으로 바뀌지 않습니다"; return; }
    btn.disabled = true; btn.textContent = "보내는 중…";
    var fin = function(){ READ = new Date(); render(); };
    if(!ackRef){ fin(); return; }
    ackRef.update({readAt: firebase.firestore.FieldValue.serverTimestamp(), readCount: firebase.firestore.FieldValue.increment(1)})
      .then(fin).catch(function(e){ console.warn(e); btn.disabled = false; btn.textContent = "✓ 다시 눌러 주세요"; });
  });
}

/* ---------- 불러오기 ---------- */
(function(){
  var m = location.hash.match(/[#&]k=([A-Za-z0-9_-]{6,})/);
  var key = m && m[1];
  if(!key){ note("주소가 올바르지 않습니다", "받으신 링크를 다시 눌러 주세요."); return; }
  try{ firebase.initializeApp(FB); }catch(e){ note("불러오지 못했습니다", "잠시 후 다시 눌러 주세요."); return; }
  var db = firebase.firestore();
  ackRef = db.collection(COLL).doc(key);
  ackRef.get().then(function(snap){
    if(!snap.exists){ note("리포트를 찾을 수 없습니다", "주소가 잘못되었거나 지워진 리포트입니다.", "선생님께 다시 요청해 주세요"); return; }
    var d = snap.data() || {};
    if(d.expireAt && Date.now() > d.expireAt){ note("기간이 지난 링크입니다", "리포트는 보낸 날로부터 4주 동안 열어볼 수 있습니다.", "선생님께 다시 요청해 주세요"); return; }
    try{ P = typeof d.payload === "string" ? JSON.parse(d.payload) : d.payload; }catch(e){ P = null; }
    if(!P || !P.weeks || !P.weeks.length){ note("리포트 내용이 비어 있습니다", "선생님께 다시 요청해 주세요."); return; }
    READ = d.readAt || null;
    VIEW = P.weeks.length - 1;
    render();
  }).catch(function(e){ console.warn(e); note("불러오지 못했습니다", "인터넷 연결을 확인하고 다시 눌러 주세요."); });
})();
</script>
</body></html>
